[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portolan-api"
version = "0.0.0"
description = "HTTP API for Portolan Hub."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "../LICENSE" }
authors = [{ name = "Portolan Hub contributors" }]
dependencies = [
    "portolan-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.uv.sources]
portolan-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/portolan_api"]
