# Root workspace for Portolan Hub.
# Each Python package (core, api, sdk) has its own pyproject.toml.
# This file configures shared tooling (ruff, mypy, pytest) across the workspace.

[project]
name = "portolan-workspace"
version = "0.0.0"
description = "Meta project gathering Portolan Hub packages and tooling."
requires-python = ">=3.12"
dependencies = [
    "portolan-core",
    "portolan-api",
    "portolan-sdk",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "httpx>=0.27",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.uv.sources]
portolan-core = { workspace = true }
portolan-api = { workspace = true }
portolan-sdk = { workspace = true }

[tool.uv.workspace]
members = ["core", "api", "sdk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["core/src", "api/src", "sdk/src"]
extend-exclude = ["console", "docs/site"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long (ruff format handles it)
    "S101",  # assert used (fine in tests)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "N"]
# Error classes carry semantic domain names, not the Error suffix.
"core/src/portolan_core/errors.py" = ["N818"]
# Intentional grouping of __all__ by logical section.
"core/src/portolan_core/__init__.py" = ["RUF022"]
"core/src/portolan_core/models/__init__.py" = ["RUF022"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
files = ["core/src", "api/src", "sdk/src"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
testpaths = ["core/tests", "api/tests", "sdk/tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["core/src", "api/src", "sdk/src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
