[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portolan-sdk"
version = "0.0.0"
description = "Python SDK and CLI for Portolan Hub."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "../LICENSE" }
authors = [{ name = "Portolan Hub contributors" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "typer>=0.12",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[project.scripts]
portolan = "portolan_sdk.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/portolan_sdk"]
