name: Feature request
description: Suggest a new capability or improvement.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Portolan Hub does not do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: audience
    attributes:
      label: Primary audience
      options:
        - Researcher / DH
        - Institution (museum, library, archive)
        - Curator / editor
        - Developer / integrator
        - Agent / automation
    validations:
      required: true
