[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portolan-core"
version = "0.0.0"
description = "Core domain models and plugin runtime for Portolan Hub."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "../LICENSE" }
authors = [{ name = "Portolan Hub contributors" }]
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "anyio>=4.4",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
]

[tool.hatch.build.targets.wheel]
packages = ["src/portolan_core"]
